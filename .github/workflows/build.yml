name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen src.zip
        run: unzip -o src.zip -d proj
      - name: Tai logo kenh vao app
        continue-on-error: true
        run: |
          D=proj/app/src/main/assets/logos
          mkdir -p "$D"
          dl() {
            [ -s "$D/$1" ] && return 0
            curl -fsSL --max-time 30 -A "Mozilla/5.0" -e "https://vtvgo.vn/" -o "$D/$1" "$2" || rm -f "$D/$1"
            [ -s "$D/$1" ] || { rm -f "$D/$1"; echo "KHONG TAI DUOC $1"; }
          }
          V=https://vtvgo-next-assets.vtvdigital.vn/prod/images/channel/20260905/2026090510
          dl vtv1.webp  $V/df56581896-vtv1.webp
          dl vtv2.webp  $V/ed6bfd7f53-vtv2.webp
          dl vtv3.webp  $V/c725fae9ac-vtv3.webp
          dl vtv4.webp  $V/c08cf70a49-vtv4.webp
          dl vtv5.webp  $V/fdf2557ea9-vtv5.webp
          dl vtv6.webp  $V/cb01e1c339-vtv6.webp
          dl vtv7.webp  $V/714cd7639c-vtv7.webp
          dl vtv8.webp  $V/91d1ad9b7c-vtv8.webp
          dl vtv9.webp  $V/a23d3e69a3-vtv9.webp
          dl vtv10.webp $V/13687e4caf-vtv10.webp
          dl htv1.png https://upload.wikimedia.org/wikipedia/commons/0/04/HTV1.png
          dl htv2.png https://i.imgur.com/2npoF3Q.png
          dl htv3.png https://upload.wikimedia.org/wikipedia/commons/6/65/HTV3-2018.png
          ls -l "$D"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TV3-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
